name: M5Vitals
options:
  bundleIdPrefix: com.qinchuqiaox
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  M5VitalsNative:
    type: application
    platform: macOS
    sources:
      - path: M5Vitals.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleName: M5VitalsNative
        CFBundleDisplayName: M5Vitals
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qinchuqiaox.m5vitalsnative
        PRODUCT_NAME: M5VitalsNative
        SKIP_INSTALL: NO
    dependencies:
      - target: M5VitalsWidget
        embed: true
        codeSign: true

  M5VitalsWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: M5VitalsWidget
        CFBundleDisplayName: M5Vitals
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qinchuqiaox.m5vitalsnative.widget
        PRODUCT_NAME: M5VitalsWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements

schemes:
  M5VitalsNative:
    build:
      targets:
        M5VitalsNative: all
    run:
      config: Release
